# このリポジトリを GitHub Pages に公開するための設定。
# スマホのブラウザで開き、「ホーム画面に追加」して使うため。
#
# configure-pages の enablement: true が、Settings → Pages の設定を
# 自動で有効にしてくれる（手で切り替えなくてよい）。
# 失敗する場合は README の手順で、Settings → Pages から
# 「Deploy from a branch」を選んでも同じことができる。

name: Pages

on:
  push:
    branches:
      - main
      - claude/personal-wish-fulfillment-tool-nriruw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開はいちどに一つだけ。走っている途中のものは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # ビルドは要らない。素の HTML/CSS/JS をそのまま置くだけ。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
